name: Build & Package Souliff iOS Free (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor CLI & Dependencies
        run: |
          npm install

      - name: Backup Custom iOS Assets
        run: |
          mkdir -p /tmp/ios_backup
          cp -r ios/App/App/Assets.xcassets /tmp/ios_backup/ || true
          cp ios/App/App/Info.plist /tmp/ios_backup/ || true
          cp ios/App/App/AppDelegate.swift /tmp/ios_backup/ || true

      - name: Sync Capacitor iOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Restore Custom iOS AppIcon & Audio Code
        run: |
          cp -rf /tmp/ios_backup/Assets.xcassets ios/App/App/ || true
          cp -f /tmp/ios_backup/Info.plist ios/App/App/Info.plist || true
          cp -f /tmp/ios_backup/AppDelegate.swift ios/App/App/AppDelegate.swift || true

      - name: Build iOS App with Xcode (ARM64)
        run: |
          cd ios/App
          pod install || true
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Sideloadly-Ready IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/Souliff.app
          cd build
          zip -qr Souliff_Free_iOS_1.39_Sideloadly.ipa Payload
          cd ..
          ls -la build/

      - name: Upload Sideloadly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souliff_Free_iOS_1.39_Sideloadly_IPA
          path: build/Souliff_Free_iOS_1.39_Sideloadly.ipa
          retention-days: 30
