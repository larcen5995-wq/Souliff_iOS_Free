name: Build & Package Souliff iOS Free (IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor CLI & Dependencies
        run: |
          npm install

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App with Xcode (ARM64)
        run: |
          cd ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ../../build/Souliff.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Mach-O App into Sideloadly-Ready IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Souliff.xcarchive/Products/Applications/App.app build/Payload/Souliff.app
          cd build
          zip -qr Souliff_Free_iOS_1.38_Sideloadly.ipa Payload
          cd ..

      - name: Upload Sideloadly IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souliff_Free_iOS_1.38_Sideloadly_IPA
          path: build/Souliff_Free_iOS_1.38_Sideloadly.ipa
          retention-days: 30
